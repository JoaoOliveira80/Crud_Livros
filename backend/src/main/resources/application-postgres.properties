# Activate with SPRING_PROFILES_ACTIVE=postgres and a running PostgreSQL instance.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/entrelinhas}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER:entrelinhas}
spring.datasource.password=${DATABASE_PASSWORD:entrelinhas_dev}
spring.h2.console.enabled=false
# Local demo profile: schema updated by Hibernate. For production, apply data/schema-postgres.sql
# via a controlled migration and change this setting to validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

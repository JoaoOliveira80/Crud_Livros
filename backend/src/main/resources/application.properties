spring.application.name=entrelinhas-books
server.port=${PORT:8080}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Zero-setup local storage, compatible with the original livrosdb.mv.db file.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/livrosdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never

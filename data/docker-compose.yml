services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: entrelinhas
      POSTGRES_USER: entrelinhas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entrelinhas_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    voentrelinhass:
      - entrelinhas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrelinhas -d entrelinhas"]
      interval: 5s
      timeout: 5s
      retries: 10
voentrelinhass:
  entrelinhas_postgres:
